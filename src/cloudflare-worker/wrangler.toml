name = "sp-garment-worker"
main = "worker.js"
compatibility_date = "2024-04-01"

# R2 Bucket binding for images and persistent configuration
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "sp-garment-images"
preview_bucket_name = "sp-garment-images"

# (Optional but recommended) Cloudflare KV binding for fast cached configuration
# AND for rate-limiting the /api/auth/change-password endpoint. Without this
# binding, config falls back to being stored inside the R2 bucket and the
# rate limiter is skipped (Workers don't reliably share in-memory state
# between requests, so KV is what makes per-IP attempt counting possible).
# [[kv_namespaces]]
# binding = "CONFIG_KV"
# id = "YOUR_KV_NAMESPACE_ID"

[vars]
# If you enable Public Development URL or Custom Domain in Cloudflare R2 bucket settings:
# PUBLIC_R2_URL = "https://pub-yourbucketid.r2.dev"
